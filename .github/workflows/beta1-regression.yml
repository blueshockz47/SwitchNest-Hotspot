name: Beta regression
on:
  push:
    branches: [development/v8.0]
  pull_request:
  workflow_dispatch:
jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m compileall -q v8
      - run: python -m unittest -v v8.test_ftp_tree v8.test_install v8.test_updates
