name: v8 prototype tests
on:
  push:
    branches: [development/v8.0]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s v8/tests -v
      - run: python -m compileall -q v8
