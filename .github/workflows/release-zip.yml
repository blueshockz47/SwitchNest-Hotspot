name: Build and publish Linux ZIP

on:
  pull_request:
    paths:
      - ".github/workflows/release-zip.yml"
      - "v8/**"
      - "install-switchnest-v8.sh"
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Verify Python source and run unit tests
        run: |
          python3 -m compileall -q v8
          python3 -m unittest -v v8.test_ftp_tree v8.test_install v8.test_updates v8.test_autostart

      - name: Build distributable source ZIP
        shell: bash
        run: |
          python3 - <<'PY'
          import os
          import pathlib
          import subprocess
          import zipfile

          tag = os.environ.get("GITHUB_REF_NAME", "snapshot")
          if os.environ.get("GITHUB_REF_TYPE") != "tag":
              tag = "snapshot"
          root = pathlib.Path.cwd()
          output = root / "dist"
          output.mkdir(exist_ok=True)
          target = output / f"SwitchNest-Hotspot-Linux-{tag}.zip"
          files = subprocess.check_output(["git", "ls-files", "-z"]).split(b"\0")
          with zipfile.ZipFile(target, "w", zipfile.ZIP_DEFLATED) as archive:
              for raw in files:
                  if not raw:
                      continue
                  path = pathlib.Path(os.fsdecode(raw))
                  if path.is_file() and not path.is_symlink():
                      archive.write(path, arcname=f"SwitchNest-Hotspot-{tag}/{path.as_posix()}")
          print(f"Created {target} ({target.stat().st_size} bytes)")
          PY
          unzip -t dist/*.zip

      - name: Upload ZIP as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: switchnest-linux-zip
          path: dist/*.zip
          if-no-files-found: error

      - name: Publish ZIP on GitHub Releases (version tags only)
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME}"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" dist/*.zip --clobber
          else
            gh release create "$tag" dist/*.zip --title "SwitchNest $tag" --generate-notes --verify-tag
          fi
